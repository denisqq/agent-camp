name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: CGO_ENABLED=0 go build -trimpath -o camp ./cmd/camp
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}" }
      - run: tar -czf camp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz camp
      - uses: softprops/action-gh-release@v2
        with:
          files: camp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
