name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CAMP_TEST_PYTHON: ${{ github.workspace }}/runner/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.9
      - run: uv sync --project runner --frozen
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node --test installer/npm/test/*.test.js
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
