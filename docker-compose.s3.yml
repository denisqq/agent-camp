# Self-hosted S3 example: docker compose -f docker-compose.s3.yml up -d
# Requires CAMP_ADMIN_TOKEN and CAMP_S3_SECRET_KEY.
services:
  camp-s3:
    build: .
    environment:
      CAMP_ADMIN_TOKEN: ${CAMP_ADMIN_TOKEN:?Set CAMP_ADMIN_TOKEN in .env}
      CAMP_STORE: s3
      CAMP_S3_ENDPOINT: http://minio:9000
      CAMP_S3_BUCKET: agent-camp
      CAMP_CONTROL_PATH: /data/control.sqlite
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${CAMP_S3_ACCESS_KEY:-camp-local}
      AWS_SECRET_ACCESS_KEY: ${CAMP_S3_SECRET_KEY:?Set CAMP_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - camp-s3-control:/data
    command: ["init-and-serve"]
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${CAMP_S3_ACCESS_KEY:-camp-local}
      MINIO_ROOT_PASSWORD: ${CAMP_S3_SECRET_KEY:?Set CAMP_S3_SECRET_KEY in .env}
    volumes:
      - camp-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30


volumes:
  camp-s3-control:
  camp-objects:
