# Camp against an existing S3 endpoint (MinIO here as a stand-in for any
# S3-compatible service you already run). Replace the endpoint, bucket,
# and credentials with your own; Camp never provisions storage.
#
#   docker compose -f examples/compose/s3.yaml run --rm camp setup --open-registration
# Configure CAMP_S3_ENDPOINT, CAMP_S3_BUCKET and AWS credentials below before
# setup/serve. The existing bucket must already exist.
#   docker compose -f examples/compose/s3.yaml up -d
services:
  camp:
    image: ghcr.io/denisqq/agent-camp:latest
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - camp-config:/config
      - camp-control:/data
    environment:
      CAMP_CONFIG: /config/camp.json
      CAMP_STORE: s3
      CAMP_S3_ENDPOINT: ${CAMP_S3_ENDPOINT:?set CAMP_S3_ENDPOINT}
      CAMP_S3_BUCKET: ${CAMP_S3_BUCKET:?set CAMP_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${CAMP_S3_ACCESS_KEY:?set CAMP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${CAMP_S3_SECRET_KEY:?set CAMP_S3_SECRET_KEY}
    command: ["serve"]

volumes:
  camp-config:
  camp-control:
