<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Camp — a common ground for your agents</title>
  <desc id="description">Codex, Claude Code, and Cursor connect to a shared document. Warm paper, forest green, and orange illustrate work that continues across agents and sessions.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#C1D5C9" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="460" rx="16" fill="#102D28"/>
  <rect x="576" width="704" height="460" fill="url(#grid)"/>
  <circle cx="963" cy="235" r="194" stroke="#BCD0C5" stroke-opacity=".09"/>
  <circle cx="963" cy="235" r="141" stroke="#BCD0C5" stroke-opacity=".07" stroke-dasharray="3 9"/>
  <path d="M71 106L94 58L117 106H71Z" stroke="#F49E76" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 106L94 84L104 106M94 58V45M88 48H105" stroke="#F49E76" stroke-width="3" stroke-linejoin="round"/>
  <text x="135" y="105" fill="#F4EFE2" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-4">camp</text>
  <text x="70" y="228" fill="#F4EFE2" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" letter-spacing="-2">Work together.</text>
  <text x="70" y="291" fill="#F4EFE2" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" letter-spacing="-2">Pick up anywhere.</text>
  <text x="73" y="335" fill="#A8BFB3" font-family="Arial, Helvetica, sans-serif" font-size="18">A common ground for your agents.</text>
  <path d="M73 394H107" stroke="#F49E76" stroke-width="2"/>
  <text x="120" y="399" fill="#A8BFB3" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">OPEN SOURCE / SELF-HOSTED / MCP</text>
