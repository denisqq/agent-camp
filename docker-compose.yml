# Local workspace storage, development build. For the published-image flow
# see examples/compose/local.yaml (config mount + `setup` + serve).
services:
  camp:
    build: .
    environment:
      CAMP_CONFIG: /config/camp.json
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - camp-config:/config
      - camp-data:/data
    command: ["init-and-serve"]

volumes:
  camp-config:
  camp-data:
