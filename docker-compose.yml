# Local workspace storage. S3 example: docker-compose.s3.yml.
services:
  camp:
    build: .
    environment:
      CAMP_ADMIN_TOKEN: ${CAMP_ADMIN_TOKEN:?Set CAMP_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - camp-data:/data
    command: ["init-and-serve"]

volumes:
  camp-data:
